name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testbyte
          POSTGRES_USER: testbyte_app
          POSTGRES_PASSWORD: testbyte_dev_pw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testbyte_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/testbyte
          DB_USERNAME: testbyte_app
          DB_PASSWORD: testbyte_dev_pw
          JWT_SECRET: ci-only-secret-key-not-used-in-production-32b
        run: ./mvnw -B test
