spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testbyte}
    username: ${DB_USERNAME:testbyte_app}
    password: ${DB_PASSWORD:testbyte_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.zoho.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  mail:
    from: ${MAIL_FROM:no-reply@testbyte.local}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  approver-email-default: ${APPROVER_EMAIL_DEFAULT:ravitejananduri@zoho.com}
  assignment-link-expiry-days: ${ASSIGNMENT_LINK_EXPIRY_DAYS:7}
  admin-invite-expiry-hours: ${ADMIN_INVITE_EXPIRY_HOURS:72}

server:
  port: ${PORT:8080}

logging:
  level:
    com.testbyte.backend: INFO
