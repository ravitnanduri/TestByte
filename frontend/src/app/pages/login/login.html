<div class="page" style="max-width: 420px;">
  <h2>Log in</h2>

  <div class="card">
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (submit)="$event.preventDefault(); submit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input #emailInput id="email" type="email" autocomplete="email" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input #passwordInput id="password" type="password" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="loading()" style="width: 100%;">
        {{ loading() ? 'Logging in...' : 'Log in' }}
      </button>
    </form>
  </div>

  <p style="margin-top: 16px; font-size: 14px; color: var(--color-text-muted);">
    New recruiter? <a routerLink="/signup">Create an account</a>
  </p>
</div>
