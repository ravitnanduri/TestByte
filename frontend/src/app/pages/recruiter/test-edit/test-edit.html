<div class="page">
  <p><a routerLink="/recruiter/tests">&larr; Back to tests</a></p>
  <h2>Edit test</h2>

  <div class="card">
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    @if (loading()) {
      <p>Loading...</p>
    } @else if (error()) {
      <!-- error already shown above; don't render the form over blank/default data -->
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-field">
          <label for="title">Title</label>
          <input id="title" type="text" formControlName="title" />
        </div>

        <div class="form-field">
          <label for="language">Language</label>
          <select id="language" formControlName="language">
            @for (lang of languages; track lang) {
              <option [value]="lang">{{ lang }}</option>
            }
          </select>
        </div>

        <div class="form-field">
          <label for="instructions">Instructions (HTML)</label>
          <textarea id="instructions" formControlName="instructionsHtml" rows="8"></textarea>
        </div>

        <div class="form-field">
          <label>Starter code</label>
          <app-monaco-editor
            [value]="form.controls.starterCode.value"
            [language]="monacoLanguage()"
            (valueChange)="onStarterCodeChange($event)"
            style="display: block; height: 320px;"
          />
        </div>

        <div class="form-field">
          <label for="aiTrapPhrase">AI-trap phrase (optional)</label>
          <input id="aiTrapPhrase" type="text" formControlName="aiTrapPhrase" />
          <small style="color: var(--color-text-muted);">
            If a submission contains this exact text, it's flagged as possible AI use during review.
          </small>
        </div>

        <div class="form-field" style="max-width: 200px;">
          <label for="duration">Duration (minutes)</label>
          <input id="duration" type="number" formControlName="durationMinutes" min="1" />
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving...' : 'Save changes' }}
        </button>
      </form>
    }
  </div>
</div>
