<div class="page">
  <p><a routerLink="/recruiter/tests">&larr; Back to tests</a></p>
  <h2>Edit test</h2>

  @if (loading()) {
    <p>Loading...</p>
  } @else if (error() && !test()) {
    <div class="alert alert-error">{{ error() }}</div>
  } @else if (test(); as t) {
    <app-test-form
      [initialTest]="t"
      [saving]="saving()"
      [error]="error()"
      submitLabel="Save changes"
      (save)="onSave($event)"
    />
  }
</div>
