<div class="page" style="max-width: 420px;">
  <h2>Create a recruiter account</h2>

  <div class="card">
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert-success">{{ successMessage() }}</div>
    }

    @if (!successMessage()) {
      <form (submit)="$event.preventDefault(); submit()">
        <div class="form-field">
          <label for="name">Full name</label>
          <input #nameInput id="name" type="text" autocomplete="name" />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input #emailInput id="email" type="email" autocomplete="email" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input #passwordInput id="password" type="password" autocomplete="new-password" />
          <small style="color: var(--color-text-muted);">At least 8 characters</small>
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="loading()" style="width: 100%;">
          {{ loading() ? 'Creating account...' : 'Sign up' }}
        </button>
      </form>
    }
  </div>

  <p style="margin-top: 16px; font-size: 14px; color: var(--color-text-muted);">
    Already have an account? <a routerLink="/login">Log in</a>
  </p>
</div>
